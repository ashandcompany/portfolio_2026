# Vérifie chaque pull request (et chaque push sur main) : lint, types, build.
# Complète les déploiements Preview de Vercel : depuis Next 16, `next build`
# ne lance plus ESLint, une erreur de lint passerait donc inaperçue.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types et build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build
